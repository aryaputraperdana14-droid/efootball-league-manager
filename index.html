  .main{margin-left:0;width:100%;padding:18px 16px 32px}

<body>
<div id="app"></div>
<script>
// --- KONFIGURASI DATABASE GOOGLE DRIVE ---
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyfThi3ce10tyiisalFUGbD1qBUuLQsFU57u-Hb3oXmKbO4Wpw2reL0V7PkOLYltJYddA/exec';
// -----------------------------------------

const KEY='efootball_league_v12';
const defaultState={
  league:{name:'eFootball League',season:'Season 1',legs:1,pointsWin:3,pointsDraw:1,pointsLoss:0},
  players:[],matches:[],
  auth:{role:'public', adminPass:'admin123'}
};
let state = structuredClone(defaultState), current='dashboard', matchFilter='all', matchSearch='', standingsLeg=1, matchesLegTab=1;

function loadLocal(){
  try{
    let x=JSON.parse(localStorage.getItem(KEY)||'{}');
    return {
      ...structuredClone(defaultState),
      ...x,
      league:{...structuredClone(defaultState.league),...(x.league||{})},
      auth:{...structuredClone(defaultState.auth), ...(x.auth||{}), role:'public'}
    }
  }catch{
    return structuredClone(defaultState);
  }
}

async function load() {
  document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#21e06f;font-family:sans-serif;">
    <div style="font-size:40px;margin-bottom:20px;animation: spin 1s linear infinite;">⚽</div>
    <h2>Menghubungkan ke Database...</h2>
    <style>@keyframes spin { 100% { transform:rotate(360deg); } }</style>
  </div>`;

  if(SCRIPT_URL.startsWith('PASTE')) {
    state = loadLocal();
    render();
    toast('Mode Lokal (Google Drive belum disetting)');
    return;
  }

  try {
    let res = await fetch(SCRIPT_URL);
    let text = await res.text();
    let data = text ? JSON.parse(text) : {};
    if (Object.keys(data).length > 0) {
       state = {...structuredClone(defaultState), ...data, league:{...structuredClone(defaultState.league), ...(data.league||{})}, auth:{role:'public', adminPass: data.auth?.adminPass || defaultState.auth.adminPass}};
       localStorage.setItem(KEY,JSON.stringify(state));
    } else {
       state = loadLocal();
    }
  } catch(e) {
    console.warn("Gagal terhubung ke Drive, menggunakan data lokal", e);
    state = loadLocal();
  }
  render();
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));

  if(!SCRIPT_URL.startsWith('PASTE')) {
    let oldToast = document.getElementById('syncToast');
    if(oldToast) oldToast.remove();

    let d = document.createElement('div');
    d.id = 'syncToast';
    d.className = 'toast';
    d.style.background = '#0d1e15';
    d.style.borderColor = '#134027';
    d.innerHTML = '🔄 Sync Cloud...';
    document.body.appendChild(d);

    let cloudData = {...state, auth:{adminPass: state.auth.adminPass, role:'public'}};

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify(cloudData)
    }).then(() => {
      d.style.background = '#0a4224';
      d.innerHTML = '✓ Tersimpan di Cloud';
      setTimeout(()=>d.remove(), 2500);
    }).catch((e) => {
      d.style.background = '#61242d';
      d.style.borderColor = '#ff4d5f';
      d.innerHTML = '✕ Gagal Sync (Lokal aman)';
      setTimeout(()=>d.remove(), 4000);
      console.error(e);
    });
  }
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function player(id){return state.players.find(p=>p.id===id)}
function fmtDate(d){return d?new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-'}
function toast(msg){let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}

function standings(legView=standingsLeg){
 let t=state.players.map(p=>({id:p.id,name:p.name,username:p.username||'',played:0,wins:0,draws:0,losses:0,gf:0,ga:0,gd:0,pts:0}));
 let m=new Map(t.map(x=>[x.id,x]));
 let matches=state.matches.filter(x=>x.played && x.homeScore!==null && x.awayScore!==null && (legView===1 ? Number(x.leg||1)===1 : true));
 matches.forEach(x=>{
  let h=m.get(x.home),a=m.get(x.away);if(!h||!a)return;
  h.played++;a.played++;h.gf+=+x.homeScore;h.ga+=+x.awayScore;a.gf+=+x.awayScore;a.ga+=+x.homeScore;
  if(x.homeScore>x.awayScore){h.wins++;h.pts+=Number(state.league.pointsWin??3);a.losses++;a.pts+=Number(state.league.pointsLoss??0)}else if(x.homeScore<x.awayScore){a.wins++;a.pts+=Number(state.league.pointsWin??3);h.losses++;h.pts+=Number(state.league.pointsLoss??0)}else{h.draws++;a.draws++;h.pts+=Number(state.league.pointsDraw??1);a.pts+=Number(state.league.pointsDraw??1)}
 });
 t.forEach(x=>x.gd=x.gf-x.ga);
 return t.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));
}

function isAdmin(){return state.auth.role==='admin'}
function navItems(){
  let items=[['dashboard','⌂','Dashboard'],['standings','🏆','Klasemen'],['matches','⚽','Pertandingan'],['stats','📊','Statistik']];
  if(isAdmin()){items.push(['players','👥','Pemain'],['schedule','📅','Jadwal'],['settings','⚙','Pengaturan'])};
  return items;
}

function render(){
 let badgeText = isAdmin() ? '<i class="online-dot"></i> Presiden FIFA Berkuasa' : '🌐 Mode Publik';
 let bottomAuthBtn = isAdmin() ? 
   `<button class="logout" onclick="logoutAdmin()"><span class="ico">↪</span><span>Keluar Presiden FIFA</span></button>` :
   `<button class="admin-login-btn" onclick="promptLoginAdmin()"><span class="ico">👑</span><span>Akses Ruang Presiden FIFA</span></button>`;

 document.getElementById('app').innerHTML=`
 <aside class="sidebar" id="side"><div class="brand"><div class="brand-mark">⚽</div><div><span>${esc(state.league.name)}</span><small>LEAGUE MANAGER</small></div></div>
 <div class="nav"><div class="nav-label">Menu utama</div>${navItems().map(([k,i,v])=>`<button class="${current===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span><span>${v}</span></button>`).join('')}</div>
 <div class="nav-bottom"><div class="nav-label">Otoritas</div>${bottomAuthBtn}</div></aside>
 <main class="main"><div class="top"><div class="top-left"><button class="btn mobile-menu" onclick="toggleSidebar()">☰</button><div class="title"><div><h1>${pageTitle()}</h1><p>${esc(state.league.name)} · ${esc(state.league.season)}</p></div></div></div><span class="admin-badge">${badgeText}</span></div><div id="content">${page()}</div></main>
 <footer class="footer"><span>© 2026 <strong>eFootball League Official</strong>. All Rights Reserved.</span><span>Sistem ini dirancang oleh: <strong>Muhammad Arya Putra Perdana</strong></span></footer>`;
}

function toggleSidebar(){
  document.getElementById('side').classList.toggle('open');
}

function pageTitle(){return {dashboard:'Dashboard',standings:'Klasemen Liga',matches:'Pertandingan',players:'Manajemen Pemain',schedule:'Jadwal Liga',stats:'Statistik',settings:'Pengaturan'}[current]}
function page(){
 if(current==='dashboard')return dashboard();
 if(current==='standings')return standingsPage();
 if(current==='matches')return matchesPage();
 if(isAdmin() && current==='players')return playersPage();
 if(isAdmin() && current==='schedule')return schedulePage();
 if(current==='stats')return statsPage();
 if(isAdmin() && current==='settings')return settingsPage();
 return dashboard();

function dashboard(){

function lastMatch(pid,legView=standingsLeg){
 let games=state.matches
  .filter(m=>(m.home===pid||m.away===pid) && (state.league.legs!==2 || (legView===1 ? Number(m.leg||1)===1 : Number(m.leg||1)===2)))
  .sort((a,b)=>{
   let da=new Date(a.date||0).getTime(), db=new Date(b.date||0).getTime();
   if(da!==db)return da-db;
   return (a.id||'').localeCompare(b.id||'');
  });

 if(!games.length)return '<span class="muted">-</span>';
 let lastPlayedIndex=-1;
 games.forEach((g,i)=>{ if(g.played) lastPlayedIndex=i; });
 let items=games.map((m,i)=>{
  let isHome=m.home===pid;
  let opp=player(isHome?m.away:m.home);
  let opponent=esc(opp?.name||'-');
  if(!m.played){
   let date=m.date?new Date(m.date).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
   let title=`Belum dimainkan · vs ${opponent} · ${date}`;
   return `<span class="form-dot upcoming" title="${title}" aria-label="${title}"></span>`;
  }
  let gf=Number(isHome?m.homeScore:m.awayScore),ga=Number(isHome?m.awayScore:m.homeScore);
  let res=gf>ga?'W':gf<ga?'L':'D',cls=res==='W'?'win':res==='L'?'loss':'draw',icon=res==='W'?'✓':res==='L'?'×':'−';
  let title=`${res==='W'?'Menang':res==='L'?'Kalah':'Seri'} · ${gf}-${ga} vs ${opponent}`;
  let latest=i===lastPlayedIndex?' latest':'';
  return `<span class="form-dot ${cls}${latest}" title="${title}" aria-label="${title}">${icon}</span>`;
 }).join('');
 return `<div class="form-last5" aria-label="Semua pertandingan Leg ${legView}">${items}</div>`;
}

function generateSchedule(){
 if(!isAdmin())return;
 if(state.players.length<2)return toast('Minimal 2 pemain.');
 let startDate=new Date(document.getElementById('startDate').value+'T12:00:00'),gap=Math.max(1,+document.getElementById('gap').value||3),arr=state.players.map(p=>p.id),dummy=null;
 if(arr.length%2)arr.push(dummy);
 let n=arr.length, rounds=n-1, created=[], rotation=arr.slice(), legs=Number(state.league.legs)||1;
 for(let leg=0;leg<legs;leg++){
  let legOffset=leg*rounds*gap;
  for(let r=0;r<rounds;r++){
   let d=new Date(startDate);d.setDate(d.getDate()+legOffset+r*gap);
   for(let i=0;i<n/2;i++){
    let a=rotation[i],b=rotation[n-1-i];
    if(a&&b){
      if(leg===0) created.push({id:id(),home:a,away:b,homeScore:null,awayScore:null,played:false,date:d.toISOString(),leg:1,round:r+1});
      else created.push({id:id(),home:b,away:a,homeScore:null,awayScore:null,played:false,date:d.toISOString(),leg:2,round:r+1});
    }
   }
   rotation=[rotation[0],rotation[n-1],...rotation.slice(1,n-1)];
  }
  rotation=arr.slice();
  if(leg===1) rotation=arr.slice();
 }
 created = created.filter(m => m.home !== m.away);

 if(state.matches.length&&!confirm('Jadwal lama akan ditambahkan, bukan diganti. Lanjutkan?'))return;
 state.matches.push(...created);save();render();toast(created.length+' pertandingan dibuat ('+legs+' leg)');
}

function importData(e){
 if(!isAdmin())return;
 let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.players)||!Array.isArray(x.matches))throw 0;state={...defaultState,...x,auth:{...defaultState.auth, adminPass: x.auth?.adminPass || defaultState.auth.adminPass, role:'admin'}};save();render();toast('Data berhasil diimport')}catch{toast('File backup tidak valid')}};r.readAsText(f)
}
function resetAll(){
 if(!isAdmin())return;
 if(confirm('Semua pemain, pertandingan, dan pengaturan akan dihapus. Lanjutkan?')){state={...structuredClone(defaultState),auth:{role:'admin',adminPass:state.auth.adminPass}};save();render();toast('Data direset')}
}

function modal(html){let d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="modal-box">'+html+'</div>';document.body.appendChild(d)}
function closeModal(){document.getElementById('modal')?.remove()}

window.onload = load;
</script>
</body>
